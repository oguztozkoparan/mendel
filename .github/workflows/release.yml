name: release
# Tag vX.Y.Z (from `npm run release`) -> build all platforms -> DRAFT GitHub Release with notes.
# A human publishes the draft; only then does the in-app update checker see it. See docs/RELEASE.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # (S2)
      - name: tag must be on main (TECH.md §6.8)
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # One draft for the tag, created before the matrix so parallel uploads can't race into duplicate drafts (R24).
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # (S2)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci # .npmrc: ignore-scripts=true (S2); electron-builder fetches its own Electron
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # macOS self-install only when the build is signed + notarized; otherwise "Download" opens the release page.
          MENDEL_MAC_AUTOINSTALL: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' }}
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing turns on only when these secrets exist; empty values build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # TECH.md §6.1 (S15). After upload, but the release is only a draft: a failure here means don't publish it.
      - name: verify fuses
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) apps=(release/mac*/mendel.app) ;;
            Windows) apps=(release/win-unpacked/mendel.exe) ;;
            *) apps=(release/linux-unpacked/mendel) ;;
          esac
          for app in "${apps[@]}"; do
            out=$(npx --no-install @electron/fuses read --app "$app")
            echo "$out"
            for f in RunAsNode EnableNodeOptionsEnvironmentVariable EnableNodeCliInspectArguments LoadBrowserProcessSpecificV8Snapshot GrantFileProtocolExtraPrivileges; do
              grep -q "$f is Disabled" <<< "$out" || { echo "::error::$app: fuse $f is not disabled"; exit 1; }
            done
            for f in EnableCookieEncryption EnableEmbeddedAsarIntegrityValidation OnlyLoadAppFromAsar; do
              grep -q "$f is Enabled" <<< "$out" || { echo "::error::$app: fuse $f is not enabled"; exit 1; }
            done
          done

  notes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the draft's notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # (S2)
      - run: node scripts/changelog.mjs "$GITHUB_REF_NAME" > notes.md
      - run: gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
