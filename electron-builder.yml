appId: dev.gitdock.app
productName: gitdock
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
# TECH.md §6.1: fuses flipped at package time (electron-builder uses @electron/fuses).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.developer-tools
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] } # zip is required for latest-mac.yml
win:
  target: [{ target: nsis, arch: [x64] }]
linux:
  category: Development
  target: [{ target: AppImage, arch: [x64] }, { target: deb, arch: [x64] }]
# Update feed + release target (TECH.md §4); baked into app-update.yml, the only feed the app reads.
# PLACEHOLDERS: replace REPLACE_OWNER / REPLACE_REPO with the public GitHub repo before the first release.
publish:
  provider: github
  owner: REPLACE_OWNER
  repo: REPLACE_REPO
  releaseType: draft
# Alternative: any HTTPS static host (upload latest*.yml, installers, .blockmap there). Use instead of the block
# above, or switch in CI without editing: -c.publish.provider=generic -c.publish.url=https://downloads.example.com/gitdock/
# publish:
#   provider: generic
#   url: https://downloads.example.com/gitdock/
